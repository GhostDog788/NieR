name: Device compiler qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-compilers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dual-x86:
    name: Native x86-64 and i686 compiler bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      SDK_UBUNTU_MIRROR: https://snapshot.ubuntu.com/ubuntu/20260910T000000Z
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      NIER_VM_TIMEOUT: "3600"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
        timeout-minutes: 3

      - name: Install build and VM prerequisites
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl dpkg-dev file git ripgrep \
            binutils util-linux xz-utils zstd pkg-config libcurl4t64 \
            python3 strace qemu-system-x86 cpio gzip libc6-i386
          test -x /lib/ld-linux.so.2

      - name: Restore source and package archives
        id: archives
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .sdk/downloads
            .sdk/consumer/downloads
            .sdk/test-vm/downloads
          key: nier-device-inputs-${{ hashFiles('sdk/packages.lock', 'sdk/consumer/*.lock', 'tests/vm/*.lock') }}
        timeout-minutes: 5

      - name: Bootstrap publisher SDK
        run: bash scripts/bootstrap-sdk.sh
        timeout-minutes: 15

      - name: Build both pinned X86-only consumer SDKs
        timeout-minutes: 240
        run: |
          bash scripts/bootstrap-consumer-sdk.sh i686
          bash scripts/bootstrap-consumer-sdk.sh x86_64

      - name: Build publisher and both native consumers
        timeout-minutes: 25
        run: |
          source sdk/env.sh
          for preset in prealpha consumer-x86_64 consumer-i686; do
            cmake --preset "$preset"
            cmake --build --preset "$preset" --parallel 2
          done

      - name: Run bounded component and publisher regressions
        timeout-minutes: 15
        run: |
          source sdk/env.sh
          for preset in prealpha consumer-x86_64 consumer-i686; do
            ctest --preset "$preset" --parallel 2 --timeout 180 --no-tests=error
          done

      - name: Assemble both independent packages
        timeout-minutes: 5
        run: |
          mkdir -p artifacts
          for target in x86_64 i686; do
            bash scripts/package-consumer.sh "build/consumer-$target" \
              "artifacts/nierc-$target" ".sdk/consumer/$target"
          done

      - name: Same-artifact matrix and genuine 32-bit Linux VM
        timeout-minutes: 65
        run: |
          bash tests/dual-consumer.sh build/prealpha/nier.cfg .sdk \
            artifacts/nierc-x86_64 artifacts/nierc-i686

      - name: Complete cJSON and zlib qualification on both devices
        timeout-minutes: 120
        run: |
          timeout --kill-after=30 7100 bash corpus/qualify.sh \
            build/prealpha/nier-build artifacts/nierc-x86_64/bin/nierc .sdk \
            --i686-bundle artifacts/nierc-i686

      - name: Save verified input archives on main
        if: github.ref == 'refs/heads/main' && steps.archives.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .sdk/downloads
            .sdk/consumer/downloads
            .sdk/test-vm/downloads
          key: nier-device-inputs-${{ hashFiles('sdk/packages.lock', 'sdk/consumer/*.lock', 'tests/vm/*.lock') }}
        timeout-minutes: 5
